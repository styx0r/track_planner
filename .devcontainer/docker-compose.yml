include:
  - ../deployment/docker-compose.yml

services:
  workspace:
    image: mcr.microsoft.com/devcontainers/javascript-node:20-bookworm
    volumes:
      - ..:/workspaces/track_planner:cached
      - ${HOME}/.claude:/home/node/.claude:cached
      # Image/layer store for the docker-in-docker feature; survives rebuilds.
      - dind_var_lib_docker:/var/lib/docker
    command: sleep infinity
    # Required by the docker-in-docker devcontainer feature (inner dockerd).
    privileged: true
    environment:
      BACKEND_URL: http://localhost:3333
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3333
      ARANGO_URL: http://arangodb:8529
      ARANGO_ROOT_USER: root
      ARANGO_ROOT_PASSWORD: track_planner
      ARANGO_DATABASE: track-planner
      ARANGO_USER: track-planner
      ARANGO_PASSWORD: track-planner
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_REGION: eu-central-1
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: "9000"
      MINIO_PUBLIC_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: music-files
      MPV_PATH: ""
      NX_SKIP_NX_CACHE: "true"
    depends_on:
      - arangodb
      - minio

volumes:
  dind_var_lib_docker:
