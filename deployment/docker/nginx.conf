# Serves a Next.js static export (`output: 'export'`) with clean URLs,
# mirroring what `npx serve out` does in prod-all.ps1.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # /foo -> /foo.html or /foo/index.html
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  error_page 404 /404.html;

  # Hashed build assets can be cached aggressively.
  location /_next/static/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
